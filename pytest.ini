[pytest]
pythonpath = . backend backend/01_intake backend/02_preprocessing backend/03_models backend/04_xai backend/05_orchestration backend/06_mlops backend/07_api frontend remoteness scripts
testpaths = tests/unit
norecursedirs = export .* build dist node_modules
filterwarnings =
    ignore:The set_bad function will be deprecated in a future version.*:PendingDeprecationWarning:shap\.plots\.colors\._colors
    ignore:The set_over function will be deprecated in a future version.*:PendingDeprecationWarning:shap\.plots\.colors\._colors
    ignore:The set_under function will be deprecated in a future version.*:PendingDeprecationWarning:shap\.plots\.colors\._colors
    ignore:'l1_ratios=None' was deprecated in version 1.8 and will trigger an error in 1.10.*:FutureWarning:sklearn\.linear_model\._logistic
    ignore:Using `httpx` with `starlette\.testclient` is deprecated.*
    ignore:(?s).*on_event is deprecated.*:DeprecationWarning
    ignore:'asyncio\.iscoroutinefunction' is deprecated.*
    ignore:LightGBM binary classifier with TreeExplainer shap values output has changed.*:UserWarning:shap\.explainers\._tree
markers =
    timeout: marks tests with a timeout
